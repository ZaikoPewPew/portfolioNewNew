<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fn burst — lab</title>
<style>
@font-face{font-family:"Styrene A LC";src:url("../assets/fonts/styrene-a-lc-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* Re-implementation of the "press fn" burst studied on voiceos.com:
   glass key → on click spawns chips, emoji sparks and speech bubbles that fly up in a fan,
   overshoot, settle and fall with gravity. Rapid clicks build a combo (bigger, denser burst). */
:root{--font:"Styrene A LC",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;--ease:cubic-bezier(.25,1,.5,1);
  --bg:#fff;--ink:#111827;--ink-3:#A5A8AC;--red:#E23336}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100svh;display:grid;place-items:center;overflow-x:clip;-webkit-font-smoothing:antialiased}
h2{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 16px;font-size:clamp(38px,6vw,72px);font-weight:400;letter-spacing:-.03em;line-height:1.05;text-align:center;padding:0 16px}
p{margin-top:24px;text-align:center;font-size:clamp(22px,3vw,40px);color:var(--ink-3);letter-spacing:-.02em}

/* glass fn key */
@property --a1{syntax:"<angle>";inherits:false;initial-value:-75deg}
@property --a2{syntax:"<angle>";inherits:false;initial-value:-45deg}
.key-wrap{position:relative;display:inline-block;z-index:2}
.key{all:unset;--bw:1px;position:relative;z-index:3;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
  width:clamp(70px,7vw,90px);aspect-ratio:1;border-radius:18px;
  background:linear-gradient(-75deg,rgba(230,235,245,.1),rgba(240,244,250,.25),rgba(230,235,245,.1));-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  box-shadow:inset 0 2px 2px rgba(0,0,0,.05),inset 0 -2px 2px rgba(255,255,255,.5),inset 0 0 1.6px 4px rgba(220,225,235,.25);
  transition:transform .4s var(--ease),box-shadow .4s var(--ease),--a1 .5s,--a2 .5s}
.key::after{content:"";position:absolute;inset:calc(var(--bw)/-2);border-radius:inherit;padding:var(--bw);pointer-events:none;
  background:conic-gradient(from var(--a1),rgba(17,24,39,.35),rgba(200,205,215,.1) 5% 40%,rgba(17,24,39,.35) 50%,rgba(200,205,215,.1) 60% 95%,rgba(17,24,39,.35)),linear-gradient(rgba(235,238,245,.5),rgba(245,247,250,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.key span{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:clamp(32px,3.4vw,48px);color:#323232;letter-spacing:-.01em;user-select:none}
.key span::after{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(var(--a2),transparent 0,rgba(255,255,255,.5) 40% 50%,transparent 55%) 0 0/200% 200% no-repeat;transition:background-position .5s var(--ease)}
.key:hover{--a1:-125deg;--a2:135deg;transform:scale(.975)}
.key:hover span::after{background-position:30% 30%}
.key:active{transform:scale(.88);transition:transform 80ms ease-out}

/* particles */
.origin{position:absolute;left:50%;top:50%;width:0;height:0;overflow:visible;pointer-events:none;z-index:4}
.pt{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;opacity:0;will-change:transform,opacity;backface-visibility:hidden;
  transform:translate(-50%,-50%) scale(0);animation:burst var(--bt,2.5s) linear var(--bd,0s) forwards}
.pt.bubble{padding:7px 14px;border-radius:18px;font:400 14px/1.4 var(--font)}
.pt.bubble::after{content:"";position:absolute;bottom:-5px;width:10px;height:6px;clip-path:polygon(0 0,100% 0,50% 100%)}
.pt.white{background:#F0F2F6;color:#111827}
.pt.white::after{background:#F0F2F6;left:18%}
.pt.red{background:var(--red);color:#fff}
.pt.red::after{background:var(--red);right:18%}
.pt.spark{font-size:26px;line-height:1}
.pt.chip{width:var(--cw);height:var(--ch);border-radius:var(--cr);background:var(--bc)}
/* fan out → overshoot → settle → fall with gravity + sideways wobble */
@keyframes burst{
  0%{opacity:0;transform:translate3d(-50%,-50%,0) scale(.18) rotate(calc(var(--br) * -.5));animation-timing-function:cubic-bezier(.05,.85,.15,1)}
  8%{opacity:1;transform:translate3d(calc(-50% + var(--bx)*.5 - var(--bw)*.5),calc(-50% + var(--by)*.5),0) scale(calc(var(--bs)*1.3)) rotate(calc(var(--br)*-.18));animation-timing-function:cubic-bezier(.3,0,.35,1)}
  15%{opacity:1;transform:translate3d(calc(-50% + var(--bx)*.66 - var(--bw)*.2),calc(-50% + var(--by)*.66),0) scale(calc(var(--bs)*.93)) rotate(calc(var(--br)*.08));animation-timing-function:cubic-bezier(.2,.65,.3,1)}
  44%{opacity:1;transform:translate3d(calc(-50% + var(--bx)*.97 + var(--bw)*.7),calc(-50% + var(--by)*.99),0) scale(var(--bs)) rotate(calc(var(--br)*.5));animation-timing-function:cubic-bezier(.5,0,.85,.55)}
  100%{opacity:0;transform:translate3d(calc(-50% + var(--bx)*1.12 + var(--bw)*1.8),calc(-50% + var(--by) + var(--bg)),0) scale(calc(var(--bs)*.84)) rotate(var(--br))}}
@keyframes still{0%,100%{opacity:0}25%,70%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pt{animation:still 1.4s ease-out var(--bd,0s) forwards;transform:translate3d(calc(-50% + var(--bx)),calc(-50% + var(--by)),0) scale(var(--bs))}}
</style>
</head>
<body>
<main>
  <h2><span>Press</span><span class="key-wrap"><button class="key" id="fn" type="button" aria-label="Press fn"><span>fn</span></button><div class="origin" id="origin" aria-hidden="true"></div></span><span>and say hi.</span></h2>
  <p>Let your ideas do the work.</p>
</main>
<script>
(() => {
// our own copy — design-flavoured phrases
const PHRASES=['Hello! 👋','Salem! 🏔️','Привет! ❄️','Ship it 🚀','Nice flow ✨','Pixel perfect 🎯','LGTM ✅','So clean 🧼','Love it ❤️','Let’s build 🛠️','Big brain 🧠','Figma magic 🪄','Wow 🤩','Smooth ⚡️','Nailed it 🙌','Clean UI 💎','New idea 💡','Great UX 🌟','Coffee ☕️','Fire 🔥','Bravo 👏','Chef’s kiss 🤌','Nice one 🎉','Rakhmet! 🙏'];
const SPARKS=['✨','🎉','💬','❤️','🌟','🎊','⚡️','🫧','🎈','💫','🚀','🎙️','💡','🔥','🎯','🌀'];
const CHIPS=['#E23336','#F0555A','#111827','#A5A8AC','#D5D8DD'];
const origin=document.getElementById('origin'), key=document.getElementById('fn');
let combo=0, lastHit=0;
key.addEventListener('click',()=>{
  const now=performance.now();
  combo = now-lastHit<900 ? Math.min(combo+1,5) : 1; lastHit=now;           // rapid clicks → up to x5
  const boost=1+(combo-1)*.2, fit=Math.max(.62,Math.min(1,innerWidth/900));  // bigger on combo, smaller on phones
  const groups=[
    {kind:'chip',  n:14+Math.floor(Math.random()*7)+(combo-1)*4, near:190, far:300, dur:.85, jitter:.45},
    {kind:'spark', n:5+Math.floor(Math.random()*4)+(combo-1)*2,  near:160, far:250, dur:1.05, jitter:.45},
    {kind:'bubble',n:8+Math.floor(Math.random()*4)+(combo-1)*2,  near:145, far:235, dur:1.15, jitter:.5},
  ];
  const used=new Set(), made=[];
  groups.forEach(g=>{ for(let i=0;i<g.n;i++){
    const ang=-Math.PI/2+(Math.random()-.5)*Math.PI*1.25;                    // upward fan, ±112°
    const dist=(g.near+Math.random()*g.far)*fit*boost;
    const el=document.createElement('div'); let cls=g.kind;
    if(g.kind==='spark') el.textContent=SPARKS[Math.random()*SPARKS.length|0];
    if(g.kind==='bubble'){ let k; do k=Math.random()*PHRASES.length|0; while(used.has(k)&&used.size<PHRASES.length); used.add(k);
      el.textContent=PHRASES[k]; cls+=Math.random()>.5?' red':' white' }
    el.className='pt '+cls;
    const thin=Math.random()>.5, st=el.style;
    st.setProperty('--bx',Math.cos(ang)*dist+'px'); st.setProperty('--by',Math.sin(ang)*dist+'px');
    st.setProperty('--bg',(130+Math.random()*170)*fit+'px');                 // gravity drop at the end
    st.setProperty('--bw',(Math.random()-.5)*90*fit+'px');                   // sideways wobble
    st.setProperty('--br',(Math.random()-.5)*(g.kind==='chip'?220:70)+'deg');
    st.setProperty('--bs',.82+Math.random()*.3);
    const delay=.13*Math.pow(Math.random(),1.8), dur=g.dur+Math.random()*g.jitter;
    st.setProperty('--bd',delay+'s'); st.setProperty('--bt',dur+'s');
    if(g.kind==='chip'){ st.setProperty('--bc',CHIPS[Math.random()*CHIPS.length|0]); st.setProperty('--cw',(thin?5:9)+'px'); st.setProperty('--ch',(thin?13:9)+'px'); st.setProperty('--cr',(thin?2:3)+'px') }
    made.push([el,delay+dur]);
  }});
  made.forEach(([el])=>origin.appendChild(el));
  const life=Math.max(...made.map(m=>m[1]))*1000+300;
  setTimeout(()=>made.forEach(([el])=>el.remove()),life);
});
})();
</script>
</body>
</html>
