<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Vladislav Kurguzov</title>
<!-- served for any missing path, so every link here is absolute -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<script>
  (function(){ var t, h = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)'); try{ t = localStorage.getItem('theme') }catch(e){}
    h.dataset.theme = t || (mq.matches ? 'dark' : 'light');
    if(!t) mq.addEventListener('change', function(e){ h.dataset.theme = e.matches ? 'dark' : 'light' });
    var tc = document.querySelector('meta[name="theme-color"]'), sync = function(){ tc.content = h.dataset.theme === 'dark' ? '#0B0D12' : '#FFFFFF' };
    sync(); new MutationObserver(sync).observe(h, { attributes: true, attributeFilter: ['data-theme'] }); })();
</script>
<link rel="stylesheet" href="/cases/case.css">
<style>
.nf{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:48px var(--gutter);text-align:center}
.nf svg.star{width:56px;height:56px;color:var(--red);animation:nf-spin 24s linear infinite}
.nf h1{font-weight:400;font-size:clamp(32px,5vw,48px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.nf p{color:var(--ink-3);font-size:19px;line-height:1.5;max-width:420px;text-wrap:balance}
.nf .glass{display:inline-flex;align-items:center;gap:6px;height:44px;margin-top:16px;padding:0 20px 0 14px;border-radius:99px;font-size:15px}
.nf .glass svg{width:20px;height:20px}
@keyframes nf-spin{to{rotate:360deg}}
@media (prefers-reduced-motion:reduce){.nf svg.star{animation:none}}
</style>
</head>
<body>
<main class="nf">
  <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><polygon fill="currentColor" points="12,0 13.99,7.2 20.49,3.51 16.8,10.01 24,12 16.8,13.99 20.49,20.49 13.99,16.8 12,24 10.01,16.8 3.51,20.49 7.2,13.99 0,12 7.2,10.01 3.51,3.51 10.01,7.2"/></svg>
  <h1>This page doesn’t exist</h1>
  <p>The link may be broken, or the page has moved</p>
  <a class="glass" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Go home</a>
</main>
</body>
</html>
