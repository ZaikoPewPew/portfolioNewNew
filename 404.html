<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script>
  /* served for any missing path: resolve links from the site root — "/" on krgzv.net, "/<repo>/" on *.github.io */
  (function(){ var seg = location.pathname.split('/')[1];
    var root = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
    document.write('<base href="' + root + '">'); })();
</script>
<title>Page not found — Vladislav Kurguzov</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<script>
  (function(){ var t, h = document.documentElement; try{ t = localStorage.getItem('theme') }catch(e){}
    h.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.querySelector('meta[name="theme-color"]').content = h.dataset.theme === 'dark' ? '#0A0A0B' : '#FFFFFF'; })();
</script>
<style>
@font-face{font-family:"Styrene A LC";src:url("assets/fonts/styrene-a-lc-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* tokens and the glass pill are the home page ones (index.html) */
:root{
  --font:"Styrene A LC","Styrene A","Styrene A Web",-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  --ease:cubic-bezier(.25,1,.5,1); --spring:cubic-bezier(.34,1.28,.42,1);
  --gutter:clamp(16px,2.5vw,32px);
  --bg:#FFFFFF; --ink:#111827; --ink-3:#A5A8AC; --red:#E23336;
  --gb-fill:linear-gradient(-75deg,#e6f5ff14,#f0faff33,#e6f5ff14);
  --gb-bevel:inset 0 2px 2px #0000000d,inset 0 -2px 2px #ffffff80;
  --gb-drop:0 4px 2px -2px #0003;         --gb-drop-h:0 2.4px .8px -1.6px #00000040;
  --gb-glow:inset 0 0 1.6px 4px #d2ebff40; --gb-glow-h:inset 0 0 .8px 1.6px #ffffff80;
  --gb-rim-a:#143c7880; --gb-rim-b:#96c8ff1a; --gb-rim-base:linear-gradient(180deg,#dcf0ff80,#f0faff80); --gb-rim-line:#dcf0ff80;
  --gb-sheen:#ffffff80; --gb-ink:#323232; --gb-ink-shadow:0 .05em .05em #0000000d;
  --gb-shadow:linear-gradient(#00326426,#00509614);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A0A0B; --ink:#F5F5F7; --ink-3:#6B6B74;
  --gb-fill:linear-gradient(-75deg,#ffffff06,#ffffff14 50%,#ffffff06);
  --gb-bevel:inset 0 1px 1px #ffffff1a,inset 0 -2px 2px #00000059;
  --gb-drop:0 4px 2px -2px #000000b3;      --gb-drop-h:0 2.4px .8px -1.6px #000000cc;
  --gb-glow:inset 0 0 1.6px 4px #ffffff05; --gb-glow-h:inset 0 0 .8px 1.6px #ffffff0f;
  --gb-rim-a:#ffffff40; --gb-rim-b:#ffffff08; --gb-rim-base:linear-gradient(180deg,#ffffff12,#ffffff05); --gb-rim-line:#ffffff0d;
  --gb-sheen:#ffffff14; --gb-ink:#F4F4F5; --gb-ink-shadow:0 .05em .1em #00000080;
  --gb-shadow:linear-gradient(#000000a6,#00000066);
  color-scheme:dark;
}
@property --angle-1{syntax:"<angle>";inherits:false;initial-value:-75deg}
@property --angle-2{syntax:"<angle>";inherits:false;initial-value:-45deg}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1{font-weight:400}

.nf{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px var(--gutter);text-align:center}
.logo{display:flex;align-items:center;height:38px}
.star{display:inline-block;width:24px;height:24px;color:var(--red);transition:transform .8s var(--spring)}
.star svg{width:100%;height:100%;display:block;fill:currentColor}
.logo:hover .star{transform:rotate(90deg) scale(1.1)}
.statement{max-width:877px;margin-top:clamp(32px,4vw,48px);font-size:clamp(26px,3.2vw,40px);line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.statement em{font-style:normal;color:var(--red)}
.statement .sub{display:block;margin-top:16px;color:var(--ink-3);font-size:18px;line-height:1.5;letter-spacing:-.011em}
.cta{margin-top:clamp(32px,4vw,48px)}

/* glass pill — same recipe as «Open to work» / «Work with me» */
.gb-wrap{position:relative;z-index:2;border-radius:999vw;transition:all .4s var(--ease)}
.gb{--bw:clamp(1px,.0625em,4px);--angle-1:-75deg;--angle-2:-45deg;position:relative;z-index:3;display:flex;align-items:center;justify-content:center;height:68px;border-radius:999vw;cursor:pointer;-webkit-tap-highlight-color:transparent;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);background:var(--gb-fill);
  box-shadow:var(--gb-bevel),var(--gb-drop),var(--gb-glow);transition:all .4s var(--ease)}
.gb:hover{--angle-1:-125deg;--angle-2:135deg;-webkit-backdrop-filter:blur(.16px);backdrop-filter:blur(.16px);transform:scale(.975);
  box-shadow:var(--gb-bevel),var(--gb-drop-h),var(--gb-glow-h)}
.gb:active{transform:scale(.94);transition-duration:80ms}
.gb:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.gb::after{content:"";position:absolute;z-index:1;inset:calc(var(--bw) / -2);padding:var(--bw);box-sizing:border-box;border-radius:999vw;pointer-events:none;
  background:conic-gradient(from var(--angle-1) at 50% 50%,var(--gb-rim-a),var(--gb-rim-b) 5% 40%,var(--gb-rim-a) 50%,var(--gb-rim-b) 60% 95%,var(--gb-rim-a)),var(--gb-rim-base);
  box-shadow:inset 0 0 0 calc(var(--bw) / 2) var(--gb-rim-line);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  transition:all .4s var(--ease),--angle-1 .5s}
.gb>span{position:relative;z-index:4;display:flex;align-items:center;gap:.6em;height:100%;padding-inline:1.75em;color:var(--gb-ink);font:400 1.125rem/1 var(--font);letter-spacing:-.18px;white-space:nowrap;user-select:none;text-shadow:var(--gb-ink-shadow);transition:all .4s var(--ease)}
.gb::before{--angle-2:-45deg;content:"";position:absolute;z-index:2;inset:calc(var(--bw) / 2);border-radius:999vw;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(var(--angle-2),#fff0 0,var(--gb-sheen) 40% 50%,#fff0 55%) 0 0/200% 200% no-repeat;
  transition:background-position .5s var(--ease),--angle-2 .5s var(--ease)}
.gb:hover::after{--angle-1:-125deg}
.gb:hover::before{--angle-2:135deg;background-position:30% 30%}
.gb-shadow{--cut:2em;position:absolute;inset:calc(var(--cut) / -2);pointer-events:none;filter:blur(clamp(2px,.125em,12px));transition:filter .4s var(--ease)}
.gb-shadow::after{content:"";position:absolute;left:calc(var(--cut) - .875em);top:calc(var(--cut) - .5em);width:calc(100% - var(--cut) - .25em);height:calc(100% - var(--cut) - .25em);box-sizing:border-box;padding:.125em;border-radius:999vw;
  background:var(--gb-shadow);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);transition:all .4s var(--ease)}
.gb-wrap:has(.gb:hover) .gb-shadow{filter:blur(clamp(2px,.0625em,6px))}
.gb-wrap:has(.gb:hover) .gb-shadow::after{top:calc(var(--cut) - .875em)}
.gb .star{width:18px;height:18px;color:currentColor}
.gb:hover .star{transform:rotate(90deg)}

/* the same soft rise-in the home blocks use */
.nf>*{animation:rise .9s var(--ease) both}
.nf>:nth-child(2){animation-delay:.08s}
.nf>:nth-child(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;translate:0 28px;filter:blur(6px)}}
@media (prefers-reduced-motion:reduce){.nf>*{animation:none}}
</style>
</head>
<body>
<main class="nf">
  <a href="./" class="logo" aria-label="Vladislav Kurguzov — home"><span class="star"><svg viewBox="0 0 24 24"><polygon points="12,0 13.99,7.2 20.49,3.51 16.8,10.01 24,12 16.8,13.99 20.49,20.49 13.99,16.8 12,24 10.01,16.8 3.51,20.49 7.2,13.99 0,12 7.2,10.01 3.51,3.51 10.01,7.2"/></svg></span></a>
  <h1 class="statement">This page <em>doesn’t exist</em><span class="sub">The link may be broken, or the page has moved</span></h1>
  <div class="cta gb-wrap"><a class="gb" href="./"><span><span class="star" aria-hidden="true"><svg viewBox="0 0 24 24"><polygon points="12,0 13.99,7.2 20.49,3.51 16.8,10.01 24,12 16.8,13.99 20.49,20.49 13.99,16.8 12,24 10.01,16.8 3.51,20.49 7.2,13.99 0,12 7.2,10.01 3.51,3.51 10.01,7.2"/></svg></span>Go home</span></a><div class="gb-shadow" aria-hidden="true"></div></div>
</main>
</body>
</html>
